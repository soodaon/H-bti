<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>H-BTI 남편 육아 기질 테스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@2.0/nanumsquare.css">
<style>
  :root{
    --bg:#FAF6EF;
    --bg-soft:#F2EAE0;
    --surface:#FFFFFF;
    --surface-2:#F3ECE1;
    --line: rgba(29,49,37,0.10);
    --text:#1D3125;
    --text-dim:#48584A;
    --text-dimmer:#758071;
    --accent:#1D3125;
    --accent-2:#3F5C48;
    --sage:#A5B5A1;
    --sand:#D2C3B3;
    --d:#2F4A38;
    --a:#B5651D;
    --r:#B4914B;
    --f:#7C93A8;
    --x:#8B8398;
    --m:#5E8149;
    --p:#8A5A3B;
    --radius:20px;
    --radius-sm:12px;
    --shadow: 0 1px 2px rgba(29,49,37,0.05), 0 10px 24px -14px rgba(29,49,37,0.18);
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(1100px 700px at 15% -10%, #EDF1E6 0%, transparent 60%),
      radial-gradient(900px 600px at 110% 10%, #F3E7D8 0%, transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Dotum', 'DotumChe', 'Noto Sans KR', -apple-system, sans-serif;
    font-weight:500;
    min-height:100vh;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  p, span, label, li, td, div{ font-weight:inherit; }
  .app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .display{ font-family:'NanumSquare', 'Noto Sans KR', sans-serif; font-weight:800; letter-spacing:0.01em; }
  /* ---------- top bar ---------- */
  .topbar{
    padding:18px 22px 10px;
    display:flex; align-items:center; gap:10px;
  }
  .badge-dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 0 4px rgba(29,49,37,0.10);
    flex:none;
  }
  .topbar span{ font-size:12px; color:var(--text-dim); letter-spacing:0.14em; text-transform:uppercase; }
  .share-btn{
    margin-left:auto; display:flex; align-items:center; gap:6px;
    background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    font-family:inherit; font-size:12.5px; font-weight:700;
    padding:9px 14px; border-radius:100px; cursor:pointer; white-space:nowrap;
    transition:transform .12s ease, border-color .12s ease;
  }
  .share-btn:hover{ border-color:var(--accent); }
  .share-btn:active{ transform:scale(0.96); }
  .share-btn:focus-visible{ outline:2px solid #fff; outline-offset:2px; }
  main{ flex:1; display:flex; flex-direction:column; padding:6px 22px 40px; }
  /* ---------- intro ---------- */
  .intro-hero{
    text-align:center;
    padding:28px 6px 10px;
  }
  .intro-hero .eyebrow{
    display:inline-block;
    font-size:12px;
    color:var(--accent);
    letter-spacing:0.18em;
    border:1px solid rgba(29,49,37,0.25);
    background:rgba(165,181,161,0.18);
    padding:5px 12px;
    border-radius:100px;
    margin-bottom:18px;
  }
  .intro-hero h1{
    font-family:'NanumSquare','Noto Sans KR',sans-serif;
    font-weight:800;
    font-size:31px; line-height:1.5; letter-spacing:0.02em; margin:0 0 14px;
    background:linear-gradient(135deg,#1D3125, #4A6B4E 55%, #8C9E85);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .intro-hero p{ color:var(--text-dim); font-size:15px; line-height:1.65; margin:0 auto; max-width:340px; }
  .type-strip{
    display:flex; justify-content:center; gap:10px; margin:26px 0 8px; flex-wrap:wrap;
  }
  .type-chip{
    width:46px;height:46px;border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;
    background:var(--surface);
    border:1px solid var(--line);
    box-shadow:var(--shadow);
  }
  .field{ margin-top:22px; }
  .field label{ display:block; font-size:13px; color:var(--text-dim); margin-bottom:8px; font-weight:500; }
  .field input{
    width:100%; padding:15px 16px; border-radius:var(--radius-sm);
    border:1px solid var(--line); background:var(--surface);
    color:var(--text); font-size:16px; font-family:inherit;
    outline:none; transition:border-color .15s;
  }
  .field input:focus{ border-color:var(--accent); }
  .field input::placeholder{ color:var(--text-dimmer); }
  .hint{ font-size:12px; color:var(--text-dimmer); margin-top:8px; line-height:1.5; }
  .btn{
    appearance:none; border:none; cursor:pointer;
    font-family:inherit; font-weight:700; font-size:16px;
    border-radius:100px; padding:17px 20px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; transition:transform .12s ease, box-shadow .12s ease, opacity .12s;
  }
  .btn:active{ transform:scale(0.98); }
  .btn:focus-visible{ outline:2px solid #fff; outline-offset:3px; }
  .btn-primary{
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    color:#fff;
    box-shadow:0 10px 24px -8px rgba(29,49,37,0.45);
  }
  .btn-primary:disabled{ opacity:0.35; box-shadow:none; cursor:not-allowed; }
  .btn-ghost{
    background:transparent; color:var(--text-dim); border:1px solid var(--line);
  }
  .btn-block{ margin-top:26px; }
  /* ---------- quiz ---------- */
  .progress-wrap{ margin:16px 0 6px; }
  .progress-row{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .progress-row .q-count{ font-size:12px; color:var(--text-dim); letter-spacing:0.06em; }
  .progress-row .q-count b{ color:var(--text); font-size:14px; }
  .progress-track{
    height:6px; border-radius:100px; background:var(--surface); overflow:hidden;
  }
  .progress-fill{
    height:100%; border-radius:100px;
    background:linear-gradient(90deg, var(--accent), var(--sage));
    transition:width .35s ease;
  }
  .radar-mini{ display:flex; justify-content:center; margin:18px 0 4px; }
  .q-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:30px 24px 26px;
    margin-top:18px;
    min-height:150px;
    display:flex; align-items:center;
    box-shadow:var(--shadow);
  }
  .q-card p{ font-size:17px; line-height:1.6; margin:0; font-weight:500; }
  .scale{ margin-top:22px; }
  .scale-labels{ display:flex; justify-content:space-between; font-size:11px; color:var(--text-dimmer); padding:0 2px 10px; }
  .scale-btns{ display:flex; gap:8px; }
  .scale-btn{
    flex:1; aspect-ratio:1/1; border-radius:14px;
    border:1px solid var(--line); background:var(--surface);
    color:var(--text-dim); font-family:inherit; font-weight:700; font-size:15px;
    cursor:pointer; transition:all .12s ease;
    display:flex; align-items:center; justify-content:center;
  }
  .scale-btn:hover{ border-color:var(--accent); }
  .scale-btn:active{ transform:scale(0.92); }
  .scale-btn:focus-visible{ outline:2px solid #fff; outline-offset:2px; }
  .scale-btn.selected{
    background:var(--accent); border-color:var(--accent); color:#fff;
    box-shadow:0 6px 16px -6px rgba(29,49,37,0.5);
  }
  .quiz-nav{ display:flex; justify-content:space-between; margin-top:24px; }
  .link-btn{
    background:none;border:none;color:var(--text-dimmer);font-family:inherit;
    font-size:13px; cursor:pointer; padding:8px;
  }
  .link-btn:hover{ color:var(--text-dim); }
  /* ---------- gate ---------- */
  .gate-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:28px 22px; margin-top:20px;
    box-shadow:var(--shadow);
  }
  .gate-card h2{ font-size:20px; margin:0 0 8px; }
  .gate-card > p{ font-size:14px; color:var(--text-dim); line-height:1.6; margin:0 0 4px; }
  .trust-row{
    display:flex; align-items:center; gap:10px; margin-top:16px; padding:12px 14px;
    background:rgba(165,181,161,0.16); border-radius:12px;
    font-size:12px; color:var(--text-dim); line-height:1.5;
  }
  .trust-row .trust-icon{
    flex:none; width:28px; height:28px; border-radius:50%;
    background:var(--sage); color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:14px;
  }
  .checkline{
    display:flex; gap:10px; align-items:flex-start; margin-top:12px; padding:13px 14px;
    border-radius:12px;
    font-size:12px; color:var(--text-dimmer); line-height:1.6;
  }
  .checkline.required{ background:rgba(181,101,29,0.07); }
  .checkline.optional{ background:rgba(94,129,73,0.08); }
  .checkline input{ margin-top:2px; flex:none; width:17px; height:17px; accent-color:var(--accent); }
  .checkline .req-tag{ color:var(--a); font-weight:700; margin-right:2px; }
  .checkline .opt-tag{ color:var(--m); font-weight:700; margin-right:2px; }
  .policy-toggle{
    background:none; border:none; color:var(--text-dimmer); font-size:11px; text-decoration:underline;
    cursor:pointer; padding:0; margin-top:10px; margin-left:2px; font-family:inherit;
  }
  .policy-box{
    display:none; margin-top:10px; padding:14px 14px; background:var(--bg-soft); border-radius:10px;
    font-size:11.5px; color:var(--text-dimmer); line-height:1.7;
  }
  .policy-box.open{ display:block; }
  .policy-box table{ width:100%; border-collapse:collapse; margin-top:6px; }
  .policy-box td{ padding:4px 0; vertical-align:top; }
  .policy-box td:first-child{ width:76px; color:var(--text-dim); font-weight:700; }
  /* ---------- result ---------- */
  .result-hero{ text-align:center; padding:20px 0 6px;
    background: radial-gradient(180px 140px at 50% 10%, rgba(165,181,161,0.35), transparent 70%);
  }
  .result-emoji{ font-size:56px; line-height:1; margin-bottom:10px; display:flex; justify-content:center; }
  .result-eyebrow{ font-size:13px; color:var(--text-dim); margin-bottom:6px; }
  .result-name{ font-size:28px; line-height:1.3; margin:0 0 12px; }
  .result-tagline{ font-size:14px; color:var(--text-dim); max-width:340px; margin:0 auto; line-height:1.6; }
  .radar-big{ display:flex; justify-content:center; margin:22px 0 6px; }
  .section-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:22px; margin-top:16px;
    box-shadow:var(--shadow);
  }
  .section-card .label{
    font-size:12px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase;
    margin-bottom:10px; display:flex; align-items:center; gap:6px;
  }
  .section-card p{ font-size:14.5px; line-height:1.7; margin:0; color:var(--text); }
  .stat-line{
    display:flex; align-items:center; gap:14px; margin-top:16px; padding:16px 18px;
    background:linear-gradient(135deg, rgba(210,195,179,0.45), rgba(165,181,161,0.28));
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
  }
  .stat-line .num{ font-size:26px; font-weight:800; font-family:'NanumSquare','Noto Sans KR',sans-serif; color:var(--accent); flex:none; }
  .stat-line .txt{ font-size:13px; color:var(--text-dim); line-height:1.5; }
  .cta-block{
    margin-top:28px; text-align:center; padding:30px 24px;
    border-radius:var(--radius);
    background:linear-gradient(160deg, #1D3125, #2C4436 65%, #3B5442);
    border:1px solid rgba(165,181,161,0.3);
    box-shadow:0 16px 32px -16px rgba(29,49,37,0.5);
  }
  .cta-block .cta-chip{
    display:inline-block; font-size:11.5px; font-weight:700; letter-spacing:0.04em;
    color:#EFE9D9; background:rgba(210,195,179,0.18); border:1px solid rgba(210,195,179,0.35);
    padding:5px 12px; border-radius:100px; margin-bottom:14px;
  }
  .cta-block h3{ font-size:19px; margin:0 0 10px; color:#FFFFFF; }
  .cta-block p{ font-size:13.5px; color:rgba(244,241,235,0.78); line-height:1.65; margin:0 0 22px; }
  .cta-block .btn-primary{
    background:linear-gradient(135deg, var(--sage), #C7D4C2);
    color:var(--accent);
    box-shadow:0 10px 24px -10px rgba(0,0,0,0.4);
  }
  .retry-row{ text-align:center; margin-top:22px; }
  footer{ text-align:center; padding:20px 22px 30px; font-size:11px; color:var(--text-dimmer); }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
/* ============ DATA ============ */
const QUESTIONS = [
  {n:1,axis:'D',text:'남편은 카톡이나 글로 자세히 요청하면 놓치는 것 하나 없이 확실하게 해낸다.'},
  {n:2,axis:'D',text:'남편이 아이와 외출 준비 시에는 옷, 양말, 가방 위치를 매번 물어본다.'},
  {n:3,axis:'D',text:'육아를 부탁할 때 "지금 당장 해"보다 "몇시까지 부탁해"라고 시간적 여유를 주면 덜 기분나빠한다.'},
  {n:4,axis:'M',text:'본인이 담당할 구역을 고를 수 있게 선택지를 주면 더 적극적으로 움직인다.'},
  {n:5,axis:'A',text:'아이와 놀아줄 때 본인의 방식대로 진행하는 것을 선호한다.'},
  {n:6,axis:'D',text:'아이 물건을 살 때, 브랜드와 수량을 정확히 알려주면 실수 없이 딱 맞게 사 온다.'},
  {n:7,axis:'A',text:'집안일의 디테일한 순서(예: 빨래 개는 법, 설거지 순서)를 본인 방식대로 존중해 주면 열심히 참여한다.'},
  {n:8,axis:'M',text:'"여보, 설겆이랑 분리수거 중 하나만 골라" 식의 제안이 잘 통한다.'},
  {n:9,axis:'A',text:'아이와 온몸으로 부딪치며 장난치고 놀아주는 시간은 잘 버틴다.'},
  {n:10,axis:'A',text:'놀이터 등 야외 활동 시, 아이보다 본인이 더 신나서 에너지를 쏟을 때가 있다.'},
  {n:11,axis:'A',text:'아이가 징징거리거나 떼를 쓰면, 차분한 말보다는 장난스러운 리액션으로 분위기를 유쾌하게 바꾸는 편이다.'},
  {n:12,axis:'A',text:'아이 밥 먹이기, 기저귀 갈기, 목욕시키기처럼 정해진 시간표를 따르는 실무보다는, 즉흥적이고 활동적인 놀이에서 훨씬 빛을 발한다.'},
  {n:13,axis:'D',text:'아이와 감정적으로 깊은 대화를 나누는 것보다, 등하원 버스 태우기 같은 정해진 스케줄을 칼같이 지키는 데서 강점이 나온다.'},
  {n:14,axis:'F',text:'젖병 세척, 아기 장난감 소독 등 꼼꼼하고 위생이 중요한 육아 살림을 맡기면 완벽주의 성향을 보인다.'},
  {n:15,axis:'R',text:'아이가 아플 때 감정적으로 불안해하기보다, 병원 예약, 약 먹이는 시간 등을 차분하고 이성적으로 체크한다.'},
  {n:16,axis:'X',text:'아이와 몸으로 놀아주는 것보다, 집안 청소나 쓰레기 비우기 같은 가사로 육아를 서포트하는 방식이 자신에게 더 잘 맞는다고 한다.'},
  {n:17,axis:'M',text:'아이가 갑자기 심하게 울거나 돌발 상황이 생겨도 당황하지 않고 "내가 알아서 해볼게"라며 끝까지 노력하려 한다.'},
  {n:18,axis:'A',text:'육아용품 조립이나 새로운 육아 앱 사용 등 처음 접하는 일도 꺼리지 않고 일단 부딪쳐 본다.'},
  {n:19,axis:'M',text:'엄마가 없는 주말에 아이와 단둘이 반나절 이상 시간을 보내는 것에 대해 부담감을 느끼지 않는다.'},
  {n:20,axis:'F',text:'본인 나름대로 정성껏 해놓은 육아나 집안일에 대해, 있는 그대로 인정받고 싶어 하는 마음이 크다.'},
  {n:21,axis:'F',text:'잘해보려고 시도한 일에 "그렇게 하는 거 아니야" 같은 피드백을 들으면, 의욕이 빠르게 꺾이는 섬세한 마음을 가지고 있다.'},
  {n:22,axis:'F',text:'"어차피 내가 하면 욕먹으니까 그냥 당신이 시키는 것만 할게"라는 뉘앙스를 보인 적이 있다.'},
  {n:23,axis:'F',text:'아이를 케어할 때 아내가 옆에서 지켜보면, 잘하고 있는지 신경 쓰여 평소보다 조심스러워진다고 한다.'},
  {n:24,axis:'F',text:'완벽하게 해내지 못할 바에는 차라리 시작을 안 하거나 아내에게 양보하는 게 낫다고 생각하는 것 같다.'},
  {n:25,axis:'M',text:'아빠의 행동이 아이의 정서 발달이나 미래에 얼마나 결정적인 역할을 하는지 명확한 이유를 알면 적극적으로 변한다.'},
  {n:26,axis:'M',text:'남편의 노고를 진심으로 인정해 주는 "덕분에 아이가 정말 밝아졌어" 등의 말에 기뻐하거나 동기부여를 받는 편이다.'},
  {n:27,axis:'M',text:'"아빠 최고!"라며 리액션을 크게 해주는 아이의 칭찬 스티커 같은 감사 표현에 활력을 얻는다.'},
  {n:28,axis:'M',text:'가정 내에서 자신의 역할(예: 우리 집 안전 지킴이, 주말 메인 요리사 등)에 멋진 타이틀을 붙여주면 더 책임감을 갖는 것 같다.'},
  {n:29,axis:'X',text:'직장에서 에너지를 많이 쓰고 온 날은, 집에서만큼은 아무것도 하지 않고 완전히 쉬고 싶어 한다.'},

  if(useGas){
    try{
      // fire-and-forget save to the Google Sheet (no-cors: response body isn't readable, that's fine)
      await fetch(GAS_WEB_APP_URL, {
        method:'POST',
        mode:'no-cors',
        headers:{ 'Content-Type':'text/plain' },
        body: JSON.stringify({
          name:state.name, email:state.email, phone:state.phone,
          resultType:resultTypeCode, resultName, marketingConsent: state.agreeMarketing,
          scores: state.scores, answers: state.answers
        })
      });
      // read back aggregate counts for the "OOO명 중 OO%" stat line
      const res = await fetch(GAS_WEB_APP_URL, { method:'GET' });
      const data = await res.json();
      const total = data.total || 1;
      const mine = (data.counts && data.counts[resultTypeCode]) || 1;
      return { total, percent: Math.round((mine/total)*100) };
    }catch(err){
      // network/CORS hiccup — fall through to local fallback below
    }
  }
  // fallback: local shared storage (used if GAS URL isn't set or the call failed)
  let totals = {};
  try{
    const res = await window.storage.get('type_counts', true);
    if(res && res.value) totals = JSON.parse(res.value);
  }catch(e){ totals = {}; }
  totals[resultTypeCode] = (totals[resultTypeCode]||0) + 1;
  try{ await window.storage.set('type_counts', JSON.stringify(totals), true); }catch(e){}
  try{
    const id = 'lead:' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
    await window.storage.set(id, JSON.stringify({
      name:state.name, email:state.email, phone:state.phone,
      resultKey:resultTypeCode, marketingConsent: state.agreeMarketing,
      scores: state.scores, answers: state.answers, ts:new Date().toISOString()
    }), true);
  }catch(e){}
  const grand = Object.values(totals).reduce((a,b)=>a+b,0);
  const mine = totals[resultTypeCode]||1;
  return { total:grand, percent: Math.round((mine/grand)*100) };
}
/* ============ RADAR SVG ============ */
function radarSVG(pct, size, opts){
  opts = opts||{};
  const cx=size/2, cy=size/2, maxR=size*0.36;
  const order = AXES;
  const pt = (i,r)=>{
    const ang = (-90 + i*(360/order.length)) * Math.PI/180;
    return [cx + r*Math.cos(ang), cy + r*Math.sin(ang)];
  };
  const rings = [0.25,0.5,0.75,1].map(f=>{
    const pts = order.map((_,i)=>pt(i,maxR*f).join(',')).join(' ');
    return `<polygon points="${pts}" fill="none" stroke="rgba(29,49,37,0.12)" stroke-width="1"/>`;
  }).join('');
  const axisLines = order.map((_,i)=>{
    const [x,y]=pt(i,maxR);
    return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(29,49,37,0.12)" stroke-width="1"/>`;
  }).join('');
  const dataPts = order.map((a,i)=> pt(i, maxR*(pct[a]/100)) ).map(p=>p.join(',')).join(' ');
  const labels = order.map((a,i)=>{
    const [x,y]=pt(i,maxR+ (opts.labelSize||16));
    return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="${opts.fontSize||11}" font-weight="700" fill="${TYPES[a].color.replace('var(--','').replace(')','') ? TYPES[a].color : '#1D3125'}">${a}</text>`;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="overflow:visible">
    ${rings}${axisLines}
    <polygon points="${dataPts}" fill="rgba(165,181,161,0.38)" stroke="var(--accent)" stroke-width="2"/>
    ${labels}
  </svg>`;
}

    <main>
      <div class="progress-wrap">

          <span class="q-count"><b>${state.qIndex+1}</b> / ${QUESTIONS.length}</span>

      </div>
      <div class="radar-mini">${radarSVG(pct, 150, {fontSize:9,labelSize:12})}</div>

      else { state.screen='gate'; render(); }

  const skipFwd = document.getElementById('skipFwdBtn');
  if(skipFwd) skipFwd.addEventListener('click', ()=>{
    if(state.qIndex < QUESTIONS.length-1){ state.qIndex++; render(); }

function renderGate(){

  submitBtn.addEventListener('click', async ()=>{

      </div>

        <button class="link-btn" id="retryBtn">처음부터 다시 하기</button>
      </div>
    </main>
    <footer>ⓒ 엄마응답 · H-BTI (Husband-Behavior Type Indicator)</footer>
  `;
  const shareBtn = document.getElementById('shareBtn');
  shareBtn.addEventListener('click', async ()=>{
    const url = window.location.href;
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        await navigator.clipboard.writeText(url);
      }else{
        const ta = document.createElement('textarea');
        ta.value = url; ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      const original = shareBtn.textContent;
      shareBtn.textContent = '✅ 링크 복사 완료!';
      setTimeout(()=>{ shareBtn.textContent = original; }, 1800);
    }catch(err){

  document.getElementById('retryBtn').addEventListener('click', ()=>{

    state.email=''; state.phone=''; state.agreeRequired=false; state.agreeMarketing=false; state.resultKey=null; state.scores=null;

}
